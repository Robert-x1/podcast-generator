name: Ro-Podcast Generator
author: Ray Villalobos
description: "Generates a feed for a podcast from a YAML file"
runs:
  using: "docker"
  image: "Dockerfile"
branding:
  icon: "git-branch"
  color: "red"
inputs:
  email:
    description: Email used for git commit author
    required: true
    default: ${{ github.actor }}@localhost
  name:
    description: Name used for git commit author
    required: true
    default: ${{ github.actor }}
